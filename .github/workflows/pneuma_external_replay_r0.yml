# ==============================================================================
# PNEUMA-NATIVE OMEGA — AUTH-EXTERNAL-REPLAY-R0 (Revision T2 — Tier 1 Linux x86-64)
# Destination in Dedicated GitHub Repository (Default Branch):
#   .github/workflows/pneuma_external_replay_r0.yml
#
# Governance & Security Controls (Corrigendum T0 + T1 + T2):
#   - Tier 1 Mandatory Host ONLY: ubuntu-24.04 (x86_64-unknown-linux-gnu).
#   - Immutable 40-hex commit-SHA pinned GitHub Actions (F-EXT-T0-05).
#   - Least privilege (`permissions: contents: read`), manual `workflow_dispatch` only.
#   - Zero self-hash inside this file (F-EXT-T1-01): `expected_workflow_sha256` MUST
#     be supplied externally by the human principal from the local approval ledger
#     and is verified BEFORE unpacking or building anything (F-EXT-T2-01).
#   - Canonical raw Git blob ZIP transport check (784,963 bytes, non-LFS, SHA-256
#     B0E9BB1C404E16E6E08E23D40DCD08BD3B1A831D7B796D8DC97B1D773B67CFC6) (F-EXT-T1-02).
#   - Two-Stage Checkpointed Artifact Upload + 8 GB VM Swap/systemd-oomd Hardening
#     so Runner.Worker is protected against exit-143 eviction during L7 monolithic
#     `leanchecker --fresh` (~10.74 GB RSS) (F-EXT-T1-03 & F-EXT-T2-02).
# ==============================================================================

name: "PNEUMA External Replay R0 (Tier 1 Ubuntu 24.04 x86-64)"

on:
  workflow_dispatch:
    inputs:
      expected_workflow_sha256:
        description: "Human-approved 64-hex SHA-256 of .github/workflows/pneuma_external_replay_r0.yml from local approval ledger"
        required: true
        type: string
      bundle_zip_path:
        description: "Repository-relative path to unmodified canonical verification bundle ZIP"
        required: true
        default: "PNEUMA_NATIVE_OMEGA_P3C_DIFFERENTIAL_R1_TRIBUNAL_VERIFICATION_BUNDLE.zip"
        type: string
      orchestrator_script_path:
        description: "Repository-relative path to pinned pneuma_external_replay_r0_orchestrator.py"
        required: true
        default: "pneuma_external_replay_r0_orchestrator.py"
        type: string

permissions:
  contents: read

env:
  WORK_SUBDIR: "pneuma_ext_replay_r0"
  EXPECTED_BUNDLE_ZIP_BYTES: "784963"
  EXPECTED_BUNDLE_ZIP_SHA256: "B0E9BB1C404E16E6E08E23D40DCD08BD3B1A831D7B796D8DC97B1D773B67CFC6"
  EXPECTED_ORCHESTRATOR_BYTES: "52259"
  EXPECTED_ORCHESTRATOR_SHA256: "42AAFE8F51812AF9FB4DB5C8A607DAC5490B2B231962B73A9473CF7794B971A6"
  PINNED_LEAN_TOOLCHAIN: "leanprover/lean4:v4.33.1"

jobs:
  tier1_linux_x86_64_clean_replay:
    name: "Tier 1 Detached Ubuntu 24.04 x86-64 Clean Build & Fresh Leanchecker Replay"
    runs-on: ubuntu-24.04
    timeout-minutes: 210

    steps:
      - name: "1. Checkout Dedicated Repository (Read-Only, No LFS, No Persisted Credentials)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false

      - name: "2. Provision Pinned Python 3.11.8"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.8"

      - name: "3. Initialize Evidence Zone & Enforce Pre-Execution Workflow + ZIP + Orchestrator Identity Gates"
        id: preflight
        shell: bash
        env:
          INPUT_EXPECTED_WF_SHA: ${{ inputs.expected_workflow_sha256 }}
          INPUT_BUNDLE_REL: ${{ inputs.bundle_zip_path }}
          INPUT_ORCH_REL: ${{ inputs.orchestrator_script_path }}
          INPUT_GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          JOB_START_EPOCH="$(date +%s)"
          WORK_ROOT="${RUNNER_TEMP}/${WORK_SUBDIR}"
          ZONE03="${WORK_ROOT}/03_DetachedEvidenceBundle"
          rm -rf "${WORK_ROOT}"
          mkdir -p "${ZONE03}/logs"
          echo "job_start_epoch=${JOB_START_EPOCH}" >> "${GITHUB_OUTPUT}"
          echo "work_root=${WORK_ROOT}" >> "${GITHUB_OUTPUT}"
          echo "zone03=${ZONE03}" >> "${GITHUB_OUTPUT}"

          PREFLIGHT_LOG="${ZONE03}/pre_and_post_immutability_check.txt"
          echo "=== [PRE-EXECUTION] PNEUMA EXTERNAL REPLAY R0 IDENTITY & TRANSPORT GATE ===" > "${PREFLIGHT_LOG}"
          echo "UTC Timestamp          : $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${PREFLIGHT_LOG}"
          echo "GitHub Repository      : ${GITHUB_REPOSITORY:-}" >> "${PREFLIGHT_LOG}"
          echo "GitHub Ref             : ${GITHUB_REF:-}" >> "${PREFLIGHT_LOG}"
          echo "GitHub Commit SHA      : ${GITHUB_SHA:-}" >> "${PREFLIGHT_LOG}"
          echo "GitHub Workflow Ref    : ${GITHUB_WORKFLOW_REF:-}" >> "${PREFLIGHT_LOG}"
          echo "GitHub Workflow SHA    : ${INPUT_GITHUB_WORKFLOW_SHA:-}" >> "${PREFLIGHT_LOG}"
          echo "GitHub Run ID/Attempt  : ${GITHUB_RUN_ID:-} / ${GITHUB_RUN_ATTEMPT:-}" >> "${PREFLIGHT_LOG}"

          CLEAN_EXP_WF_SHA="$(echo "${INPUT_EXPECTED_WF_SHA}" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          if [[ ! "${CLEAN_EXP_WF_SHA}" =~ ^[0-9A-F]{64}$ ]]; then
            echo "CRITICAL FAIL: expected_workflow_sha256 must be an externally supplied 64-hex SHA-256!" | tee -a "${PREFLIGHT_LOG}"
            exit 2
          fi

          WF_CANDIDATE="${GITHUB_WORKSPACE}/.github/workflows/pneuma_external_replay_r0.yml"
          if [[ ! -f "${WF_CANDIDATE}" ]]; then
            WF_REL="$(echo "${GITHUB_WORKFLOW_REF:-}" | sed -E 's#^[^/]+/[^/]+/##; s#@.*$##')"
            if [[ -n "${WF_REL}" ]] && [[ -f "${GITHUB_WORKSPACE}/${WF_REL}" ]]; then
              WF_CANDIDATE="${GITHUB_WORKSPACE}/${WF_REL}"
            fi
          fi
          if [[ ! -f "${WF_CANDIDATE}" ]]; then
            echo "CRITICAL FAIL: Executed workflow file not found in repository checkout!" | tee -a "${PREFLIGHT_LOG}"
            exit 2
          fi

          cp -p "${WF_CANDIDATE}" "${ZONE03}/executed_workflow_snapshot.yml"
          EXEC_WF_BYTES="$(stat -c%s "${ZONE03}/executed_workflow_snapshot.yml")"
          EXEC_WF_SHA="$(sha256sum "${ZONE03}/executed_workflow_snapshot.yml" | awk '{print toupper($1)}')"
          echo "Expected Workflow SHA  : ${CLEAN_EXP_WF_SHA}" | tee -a "${PREFLIGHT_LOG}"
          echo "Executed Workflow SHA  : ${EXEC_WF_SHA} (${EXEC_WF_BYTES} bytes)" | tee -a "${PREFLIGHT_LOG}"
          echo "clean_exp_wf_sha=${CLEAN_EXP_WF_SHA}" >> "${GITHUB_OUTPUT}"
          echo "exec_wf_sha=${EXEC_WF_SHA}" >> "${GITHUB_OUTPUT}"
          echo "exec_wf_bytes=${EXEC_WF_BYTES}" >> "${GITHUB_OUTPUT}"

          if [[ "${EXEC_WF_SHA}" != "${CLEAN_EXP_WF_SHA}" ]]; then
            echo "CRITICAL FAIL (F-EXT-T2-01): WORKFLOW_IDENTITY_MISMATCH before build!" | tee -a "${PREFLIGHT_LOG}"
            python3 -c 'import json, sys; p=sys.argv[1]; json.dump({"schema":"PNEUMA_NATIVE_OMEGA_EXTERNAL_REPLAY_R0_RECEIPT_V1","three_axis_verdicts":{"host_independence_verdict":"INDEPENDENT_HOST_CONFIRMED","evidence_collection_verdict":"FAILURE_EVIDENCE_COLLECTED","replay_verification_verdict":"REPRODUCTION_HELD","hold_or_failure_reason":"WORKFLOW_IDENTITY_MISMATCH"},"expected_workflow_sha256":sys.argv[2],"executed_workflow_sha256":sys.argv[3]}, open(p,"w"), indent=2)' "${ZONE03}/PNEUMA_EXTERNAL_REPLAY_R0_RECEIPT.json" "${CLEAN_EXP_WF_SHA}" "${EXEC_WF_SHA}"
            exit 1
          fi

          BUNDLE_FILE="${GITHUB_WORKSPACE}/${INPUT_BUNDLE_REL}"
          if [[ ! -f "${BUNDLE_FILE}" ]] || [[ -L "${BUNDLE_FILE}" ]]; then
            echo "CRITICAL FAIL (F-EXT-T1-02): Canonical bundle ZIP missing or symlink at ${BUNDLE_FILE}" | tee -a "${PREFLIGHT_LOG}"
            exit 2
          fi
          if head -c 48 "${BUNDLE_FILE}" | grep -q "git-lfs.github.com"; then
            echo "CRITICAL FAIL (F-EXT-T1-02): Git LFS pointer rejected; raw Git blob required!" | tee -a "${PREFLIGHT_LOG}"
            exit 2
          fi
          ACTUAL_ZIP_BYTES="$(stat -c%s "${BUNDLE_FILE}")"
          ACTUAL_ZIP_SHA="$(sha256sum "${BUNDLE_FILE}" | awk '{print toupper($1)}')"
          echo "Canonical ZIP Bytes    : ${ACTUAL_ZIP_BYTES} (expected ${EXPECTED_BUNDLE_ZIP_BYTES})" | tee -a "${PREFLIGHT_LOG}"
          echo "Canonical ZIP SHA256   : ${ACTUAL_ZIP_SHA}" | tee -a "${PREFLIGHT_LOG}"
          if [[ "${ACTUAL_ZIP_BYTES}" != "${EXPECTED_BUNDLE_ZIP_BYTES}" ]] || [[ "${ACTUAL_ZIP_SHA}" != "${EXPECTED_BUNDLE_ZIP_SHA256}" ]]; then
            echo "CRITICAL FAIL (F-EXT-T1-02): Canonical bundle ZIP byte length or SHA-256 mismatch!" | tee -a "${PREFLIGHT_LOG}"
            exit 1
          fi

          ORCH_FILE="${GITHUB_WORKSPACE}/${INPUT_ORCH_REL}"
          if [[ ! -f "${ORCH_FILE}" ]] || [[ -L "${ORCH_FILE}" ]]; then
            echo "CRITICAL FAIL: Orchestrator script missing or symlink at ${ORCH_FILE}" | tee -a "${PREFLIGHT_LOG}"
            exit 2
          fi
          ACTUAL_ORCH_BYTES="$(stat -c%s "${ORCH_FILE}")"
          ACTUAL_ORCH_SHA="$(sha256sum "${ORCH_FILE}" | awk '{print toupper($1)}')"
          echo "Orchestrator Py Bytes  : ${ACTUAL_ORCH_BYTES} (expected ${EXPECTED_ORCHESTRATOR_BYTES})" | tee -a "${PREFLIGHT_LOG}"
          echo "Orchestrator Py SHA256 : ${ACTUAL_ORCH_SHA}" | tee -a "${PREFLIGHT_LOG}"
          if [[ "${ACTUAL_ORCH_BYTES}" != "${EXPECTED_ORCHESTRATOR_BYTES}" ]] || [[ "${ACTUAL_ORCH_SHA}" != "${EXPECTED_ORCHESTRATOR_SHA256}" ]]; then
            echo "CRITICAL FAIL: Orchestrator script byte length or SHA-256 mismatch!" | tee -a "${PREFLIGHT_LOG}"
            exit 1
          fi
          cp -p "${ORCH_FILE}" "${ZONE03}/executed_orchestrator_snapshot.py"
          echo "bundle_file=${BUNDLE_FILE}" >> "${GITHUB_OUTPUT}"
          echo "orch_file=${ORCH_FILE}" >> "${GITHUB_OUTPUT}"
          echo "preflight_passed=true" >> "${GITHUB_OUTPUT}"

      - name: "4. Harden VM Memory Headroom (Disable systemd-oomd + Swap Guard) & Pin Lean 4.33.1"
        id: provision
        shell: bash
        env:
          ZONE03: ${{ steps.preflight.outputs.zone03 }}
        run: |
          set -euo pipefail
          PROV_LOG="${ZONE03}/logs/step4_toolchain_provision.log"
          SWAP_NOTE="NATIVE_16GB_VM_NO_EXTRA_SWAP_NEEDED"
          MEM_TOTAL_KB="$(awk '/MemTotal:/ {print $2}' /proc/meminfo)"
          echo "Initial VM Memory Status:" | tee "${PROV_LOG}"
          free -m | tee -a "${PROV_LOG}"

          # Prevent Ubuntu 24.04 systemd-oomd from SIGTERM-killing Runner.Worker (exit 143) under swap pressure
          sudo systemctl stop systemd-oomd.socket systemd-oomd.service >/dev/null 2>&1 || true
          sudo systemctl mask systemd-oomd.socket systemd-oomd.service >/dev/null 2>&1 || true

          # On 8 GB Private Repo VMs (MemTotal < 14 GiB), provision +10 GB NVMe swapfile for L7 10.74 GB peak
          if [[ "${MEM_TOTAL_KB}" -lt 14000000 ]]; then
            SWAP_TARGET="/mnt/pneuma_ext_swap_10g"
            if [[ ! -d "/mnt" ]] || [[ "$(df -Pk /mnt | awk 'NR==2 {print $4}')" -lt 12000000 ]]; then
              SWAP_TARGET="/tmp/pneuma_ext_swap_10g"
            fi
            sudo fallocate -l 10G "${SWAP_TARGET}"
            sudo chmod 600 "${SWAP_TARGET}"
            sudo mkswap "${SWAP_TARGET}"
            sudo swapon "${SWAP_TARGET}"
            sudo sysctl -w vm.swappiness=60 >/dev/null 2>&1 || true
            SWAP_NOTE="PROVISIONED_10GB_SWAP_AT_${SWAP_TARGET}_AND_MASKED_SYSTEMD_OOMD_ON_8GB_PRIVATE_VM"
            echo "Post-Swap VM Memory Status:" | tee -a "${PROV_LOG}"
            free -m | tee -a "${PROV_LOG}"
          fi

          timeout --signal=TERM --kill-after=30s 600s bash -c '
            set -euo pipefail
            if [[ ! -x /usr/bin/time ]] || ! command -v strace >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends time strace jq unzip util-linux
            fi
            curl -sSfL https://elan.lean-lang.org/elan-init.sh -o "${RUNNER_TEMP}/elan-init.sh"
            sh "${RUNNER_TEMP}/elan-init.sh" -y --no-modify-path --default-toolchain none
            export ELAN_HOME="${HOME}/.elan"
            export PATH="${HOME}/.elan/bin:${PATH}"
            elan toolchain install "'"${PINNED_LEAN_TOOLCHAIN}"'"
            elan default "'"${PINNED_LEAN_TOOLCHAIN}"'"
            "$(elan which lean)" --version
            "$(elan which lake)" --version
          ' 2>&1 | tee -a "${PROV_LOG}"
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          echo "elan_bin=${HOME}/.elan/bin" >> "${GITHUB_OUTPUT}"
          echo "swap_note=${SWAP_NOTE}" >> "${GITHUB_OUTPUT}"

      - name: "5A. Stage 1 — Clean Build (7/7), Axioms (91/91), Suites, L1..L6 Fresh & L7 Module Leanchecker"
        id: stage1
        shell: bash
        env:
          WORK_ROOT: ${{ steps.preflight.outputs.work_root }}
          ZONE03: ${{ steps.preflight.outputs.zone03 }}
          BUNDLE_FILE: ${{ steps.preflight.outputs.bundle_file }}
          ORCH_FILE: ${{ steps.preflight.outputs.orch_file }}
          JOB_START_EPOCH: ${{ steps.preflight.outputs.job_start_epoch }}
          CLEAN_EXP_WF_SHA: ${{ steps.preflight.outputs.clean_exp_wf_sha }}
          EXEC_WF_SHA: ${{ steps.preflight.outputs.exec_wf_sha }}
          EXEC_WF_BYTES: ${{ steps.preflight.outputs.exec_wf_bytes }}
          ELAN_BIN: ${{ steps.provision.outputs.elan_bin }}
          PNEUMA_SWAP_PROVISION_NOTE: ${{ steps.provision.outputs.swap_note }}
          INPUT_GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set +e
          ORIG_HOME="${HOME}"
          ELAN_HOME_DIR="${ORIG_HOME}/.elan"
          PYTHON3_BIN="$(command -v python3)"
          FULL_PATH="${ELAN_BIN}:$(dirname "${PYTHON3_BIN}"):${PATH}"
          export HOME="${ORIG_HOME}"
          export ELAN_HOME="${ELAN_HOME_DIR}"
          export PATH="${FULL_PATH}"
          S1_LOG="${ZONE03}/logs/stage1_console.log"

          if sudo -n unshare --net sudo -u "${USER}" env "HOME=${ORIG_HOME}" "ELAN_HOME=${ELAN_HOME_DIR}" "PATH=${FULL_PATH}" "${ELAN_BIN}/elan" which lean >/dev/null 2>&1; then
            echo "Network Isolation Mode (Stage 1): KERNEL_NETNS_UNSHARE_OFFLINE" | tee "${S1_LOG}"
            sudo -n unshare --net sudo -u "${USER}" env \
              "HOME=${ORIG_HOME}" \
              "USER=${USER}" \
              "ELAN_HOME=${ELAN_HOME_DIR}" \
              "RUNNER_TEMP=${RUNNER_TEMP}" \
              "PATH=${FULL_PATH}" \
              "PNEUMA_SWAP_PROVISION_NOTE=${PNEUMA_SWAP_PROVISION_NOTE}" \
              "GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-}" \
              "GITHUB_REF=${GITHUB_REF:-}" \
              "GITHUB_SHA=${GITHUB_SHA:-}" \
              "GITHUB_WORKFLOW_REF=${GITHUB_WORKFLOW_REF:-}" \
              "INPUT_GITHUB_WORKFLOW_SHA=${INPUT_GITHUB_WORKFLOW_SHA:-}" \
              "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}" \
              "GITHUB_RUN_NUMBER=${GITHUB_RUN_NUMBER:-}" \
              "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT:-}" \
              "RUNNER_NAME=${RUNNER_NAME:-}" \
              "RUNNER_OS=${RUNNER_OS:-}" \
              "RUNNER_ARCH=${RUNNER_ARCH:-}" \
              "ImageOS=${ImageOS:-}" \
              "ImageVersion=${ImageVersion:-}" \
              "${PYTHON3_BIN}" -B "${ORCH_FILE}" \
                --phase stage1 \
                --bundle-zip "${BUNDLE_FILE}" \
                --work-root "${WORK_ROOT}" \
                --job-start-epoch "${JOB_START_EPOCH}" \
                --expected-workflow-sha256 "${CLEAN_EXP_WF_SHA}" \
                --executed-workflow-sha256 "${EXEC_WF_SHA}" \
                --executed-workflow-bytes "${EXEC_WF_BYTES}" \
                --elan-bin-dir "${ELAN_BIN}" 2>&1 | tee -a "${S1_LOG}"
            S1_EXIT="${PIPESTATUS[0]}"
          else
            echo "Network Isolation Mode (Stage 1): STANDARD_EPHEMERAL_VM_NO_NET_CALLS" | tee "${S1_LOG}"
            "${PYTHON3_BIN}" -B "${ORCH_FILE}" \
              --phase stage1 \
              --bundle-zip "${BUNDLE_FILE}" \
              --work-root "${WORK_ROOT}" \
              --job-start-epoch "${JOB_START_EPOCH}" \
              --expected-workflow-sha256 "${CLEAN_EXP_WF_SHA}" \
              --executed-workflow-sha256 "${EXEC_WF_SHA}" \
              --executed-workflow-bytes "${EXEC_WF_BYTES}" \
              --elan-bin-dir "${ELAN_BIN}" 2>&1 | tee -a "${S1_LOG}"
            S1_EXIT="${PIPESTATUS[0]}"
          fi
          (
            cd "${ZONE03}"
            rm -f evidence_manifest.sha256
            find . -type f ! -name "evidence_manifest.sha256" | LC_ALL=C sort | sed 's#^\./##' | xargs sha256sum > evidence_manifest.sha256
          )
          set -e
          echo "stage1_exit_code=${S1_EXIT}" >> "${GITHUB_OUTPUT}"

      - name: "5B. Upload Stage 1 Checkpoint Artifact Immediately Before L7 Monolithic Fresh Replay"
        if: always() && steps.preflight.outputs.preflight_passed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pneuma-external-replay-r0-stage1-checkpoint-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.preflight.outputs.zone03 }}/**
          if-no-files-found: warn
          retention-days: 90

      - name: "5C. Stage 2 — L7 Monolithic Fresh Leanchecker (~10.74 GB), Post-Immutability & Sentinels K1/K2"
        id: stage2
        if: steps.preflight.outputs.preflight_passed == 'true'
        shell: bash
        env:
          WORK_ROOT: ${{ steps.preflight.outputs.work_root }}
          ZONE03: ${{ steps.preflight.outputs.zone03 }}
          BUNDLE_FILE: ${{ steps.preflight.outputs.bundle_file }}
          ORCH_FILE: ${{ steps.preflight.outputs.orch_file }}
          JOB_START_EPOCH: ${{ steps.preflight.outputs.job_start_epoch }}
          CLEAN_EXP_WF_SHA: ${{ steps.preflight.outputs.clean_exp_wf_sha }}
          EXEC_WF_SHA: ${{ steps.preflight.outputs.exec_wf_sha }}
          EXEC_WF_BYTES: ${{ steps.preflight.outputs.exec_wf_bytes }}
          ELAN_BIN: ${{ steps.provision.outputs.elan_bin }}
          INPUT_GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set +e
          ORIG_HOME="${HOME}"
          ELAN_HOME_DIR="${ORIG_HOME}/.elan"
          PYTHON3_BIN="$(command -v python3)"
          FULL_PATH="${ELAN_BIN}:$(dirname "${PYTHON3_BIN}"):${PATH}"
          export HOME="${ORIG_HOME}"
          export ELAN_HOME="${ELAN_HOME_DIR}"
          export PATH="${FULL_PATH}"
          S2_LOG="${ZONE03}/logs/stage2_console.log"

          if sudo -n unshare --net sudo -u "${USER}" env "HOME=${ORIG_HOME}" "ELAN_HOME=${ELAN_HOME_DIR}" "PATH=${FULL_PATH}" "${ELAN_BIN}/elan" which lean >/dev/null 2>&1; then
            echo "Network Isolation Mode (Stage 2): KERNEL_NETNS_UNSHARE_OFFLINE" | tee "${S2_LOG}"
            sudo -n unshare --net sudo -u "${USER}" env \
              "HOME=${ORIG_HOME}" \
              "USER=${USER}" \
              "ELAN_HOME=${ELAN_HOME_DIR}" \
              "RUNNER_TEMP=${RUNNER_TEMP}" \
              "PATH=${FULL_PATH}" \
              "GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-}" \
              "GITHUB_REF=${GITHUB_REF:-}" \
              "GITHUB_SHA=${GITHUB_SHA:-}" \
              "GITHUB_WORKFLOW_REF=${GITHUB_WORKFLOW_REF:-}" \
              "INPUT_GITHUB_WORKFLOW_SHA=${INPUT_GITHUB_WORKFLOW_SHA:-}" \
              "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}" \
              "GITHUB_RUN_NUMBER=${GITHUB_RUN_NUMBER:-}" \
              "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT:-}" \
              "RUNNER_NAME=${RUNNER_NAME:-}" \
              "RUNNER_OS=${RUNNER_OS:-}" \
              "RUNNER_ARCH=${RUNNER_ARCH:-}" \
              "ImageOS=${ImageOS:-}" \
              "ImageVersion=${ImageVersion:-}" \
              "${PYTHON3_BIN}" -B "${ORCH_FILE}" \
                --phase stage2 \
                --bundle-zip "${BUNDLE_FILE}" \
                --work-root "${WORK_ROOT}" \
                --job-start-epoch "${JOB_START_EPOCH}" \
                --expected-workflow-sha256 "${CLEAN_EXP_WF_SHA}" \
                --executed-workflow-sha256 "${EXEC_WF_SHA}" \
                --executed-workflow-bytes "${EXEC_WF_BYTES}" \
                --elan-bin-dir "${ELAN_BIN}" 2>&1 | tee -a "${S2_LOG}"
            S2_EXIT="${PIPESTATUS[0]}"
          else
            echo "Network Isolation Mode (Stage 2): STANDARD_EPHEMERAL_VM_NO_NET_CALLS" | tee "${S2_LOG}"
            "${PYTHON3_BIN}" -B "${ORCH_FILE}" \
              --phase stage2 \
              --bundle-zip "${BUNDLE_FILE}" \
              --work-root "${WORK_ROOT}" \
              --job-start-epoch "${JOB_START_EPOCH}" \
              --expected-workflow-sha256 "${CLEAN_EXP_WF_SHA}" \
              --executed-workflow-sha256 "${EXEC_WF_SHA}" \
              --executed-workflow-bytes "${EXEC_WF_BYTES}" \
              --elan-bin-dir "${ELAN_BIN}" 2>&1 | tee -a "${S2_LOG}"
            S2_EXIT="${PIPESTATUS[0]}"
          fi
          set -e
          echo "stage2_exit_code=${S2_EXIT}" >> "${GITHUB_OUTPUT}"

      - name: "6. Post-Run Repository Checkout Immutability Re-Check & Seal Final Evidence Manifest (Always)"
        if: always()
        shell: bash
        env:
          ZONE03: ${{ steps.preflight.outputs.zone03 }}
          INPUT_BUNDLE_REL: ${{ inputs.bundle_zip_path }}
          INPUT_ORCH_REL: ${{ inputs.orchestrator_script_path }}
          S1_EXIT: ${{ steps.stage1.outputs.stage1_exit_code }}
          S2_EXIT: ${{ steps.stage2.outputs.stage2_exit_code }}
          EXEC_WF_SHA: ${{ steps.preflight.outputs.exec_wf_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${ZONE03}" ]] || [[ ! -d "${ZONE03}" ]]; then
            echo "Zone 03 directory unavailable; nothing to seal."
            exit 0
          fi
          PREFLIGHT_LOG="${ZONE03}/pre_and_post_immutability_check.txt"
          echo "" >> "${PREFLIGHT_LOG}"
          echo "=== [POST-EXECUTION] REPOSITORY CHECKOUT IMMUTABILITY RE-CHECK ===" >> "${PREFLIGHT_LOG}"
          echo "UTC Timestamp          : $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${PREFLIGHT_LOG}"
          BUNDLE_FILE="${GITHUB_WORKSPACE}/${INPUT_BUNDLE_REL}"
          if [[ -f "${BUNDLE_FILE}" ]]; then
            POST_ZIP_SHA="$(sha256sum "${BUNDLE_FILE}" | awk '{print toupper($1)}')"
            echo "Post-Run Repo ZIP SHA  : ${POST_ZIP_SHA}" | tee -a "${PREFLIGHT_LOG}"
            if [[ "${POST_ZIP_SHA}" != "${EXPECTED_BUNDLE_ZIP_SHA256}" ]]; then
              echo "CRITICAL FAIL: Repository canonical ZIP mutated during run!" | tee -a "${PREFLIGHT_LOG}"
              exit 1
            fi
          fi
          ORCH_FILE="${GITHUB_WORKSPACE}/${INPUT_ORCH_REL}"
          if [[ -f "${ORCH_FILE}" ]]; then
            POST_ORCH_SHA="$(sha256sum "${ORCH_FILE}" | awk '{print toupper($1)}')"
            echo "Post-Run Repo Orch SHA : ${POST_ORCH_SHA}" | tee -a "${PREFLIGHT_LOG}"
            if [[ "${POST_ORCH_SHA}" != "${EXPECTED_ORCHESTRATOR_SHA256}" ]]; then
              echo "CRITICAL FAIL: Repository orchestrator script mutated during run!" | tee -a "${PREFLIGHT_LOG}"
              exit 1
            fi
          fi
          (
            cd "${ZONE03}"
            rm -f evidence_manifest.sha256
            find . -type f ! -name "evidence_manifest.sha256" | LC_ALL=C sort | sed 's#^\./##' | xargs sha256sum > evidence_manifest.sha256
          )
          echo "## PNEUMA External Replay R0 — Tier 1 Ubuntu 24.04 Summary" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Stage 1 Exit Code**: \`${S1_EXIT:-NOT_RUN}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Stage 2 Exit Code**: \`${S2_EXIT:-NOT_RUN}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Executed Workflow SHA-256**: \`${EXEC_WF_SHA:-UNKNOWN}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Canonical Bundle ZIP SHA-256**: \`${EXPECTED_BUNDLE_ZIP_SHA256}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Git Commit / Run ID / Attempt**: \`${GITHUB_SHA}\` / \`${GITHUB_RUN_ID}\` / \`${GITHUB_RUN_ATTEMPT}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: "7. Upload Final Detached External Replay Evidence Bundle (Always)"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pneuma-external-replay-r0-tier1-linux-x64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.preflight.outputs.zone03 }}/**
          if-no-files-found: error
          retention-days: 90

      - name: "8. Enforce Final Verification Exit Code"
        if: always()
        shell: bash
        env:
          WORK_ROOT: ${{ steps.preflight.outputs.work_root }}
          PREFLIGHT_OK: ${{ steps.preflight.outputs.preflight_passed }}
          S1_EXIT: ${{ steps.stage1.outputs.stage1_exit_code }}
          S2_EXIT: ${{ steps.stage2.outputs.stage2_exit_code }}
        run: |
          set -euo pipefail
          if [[ -n "${WORK_ROOT}" ]] && [[ -d "${WORK_ROOT}/01_ImmutableInputSnapshot" ]]; then
            chmod -R u+w "${WORK_ROOT}/01_ImmutableInputSnapshot" || true
          fi
          if [[ "${PREFLIGHT_OK}" != "true" ]]; then
            echo "Failing job because preflight gate did not pass."
            exit 1
          fi
          if [[ "${S1_EXIT}" != "0" ]] || [[ "${S2_EXIT}" != "0" ]]; then
            echo "Failing job (Stage1=${S1_EXIT:-EMPTY}, Stage2=${S2_EXIT:-EMPTY})."
            exit 1
          fi
          echo "Tier 1 External Replay R0 completed with exit code 0."
